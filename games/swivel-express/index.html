<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Swivel Express</title>
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<script type="importmap">{"imports":{"three":"./assets/vendor/three/three.module.min.js","three/addons/":"./assets/vendor/three/addons/"}}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" hidden>
  <div class="pill lvl"><b id="hudStop">Stop 1</b><span id="hudName"></span></div>
  <div class="pill" id="hudPaxPill"><i class="ico ico-peg"></i><b id="hudPax">0/0</b></div>
  <div class="pill" id="hudHearts"></div>
  <div class="pill" id="hudCoins"><i class="ico ico-coin"></i><b id="hudCoinsN"></b></div>
  <div class="right">
    <button id="btnRestart" class="icon" aria-label="Restart">↻</button>
    <button id="btnPause" class="icon" aria-label="Pause"><span class="bars"></span></button>
  </div>
</div>
<button id="btnBrake" class="brake" hidden aria-label="Brake"><i class="ico ico-brake"></i><kbd id="brakeKey" class="wide">Space</kbd></button>

<div id="pops"></div>
<div id="banner" hidden><small id="bannerSmall"></small><b id="bannerBig"></b></div>
<div id="arrow" hidden></div>
<div id="tip" hidden>
  <div id="tipIcon"></div>
  <p id="tipText"></p>
  <button id="btnSkipTips" data-i18n="skipTips">Skip tips</button>
</div>

<section id="menu" class="screen menu" hidden>
  <div class="menu-col">
    <h1 class="logo">Swivel<span>Express</span></h1>
    <p class="tag" data-i18n="tagline">Swivel the track. The train never stops!</p>
    <button id="btnPlay" class="big"><span data-i18n="play">Play</span> <small id="playStop"></small></button>
    <div class="row">
      <button id="btnStops" class="soft"><i class="ico ico-map"></i><span data-i18n="stops">Stops</span></button>
      <button id="btnToybox" class="soft"><i class="ico ico-box"></i><span data-i18n="toybox">Toy Box</span></button>
    </div>
    <button id="btnEndless" class="soft long"><span data-i18n="endless">Endless Line</span><small id="endlessInfo"></small></button>
    <p class="stats"><i class="ico ico-star"></i><b id="menuStars">0</b><span class="dim">/<span id="menuStarsMax">45</span></span>
      <i class="ico ico-coin gap"></i><b id="menuCoins">0</b></p>
  </div>
</section>

<section id="stopsPanel" class="screen" hidden>
  <div class="panel wide">
    <h2 data-i18n="stops">Stops</h2>
    <div id="stopGrid" class="stop-grid"></div>
    <button id="btnStopsBack" class="soft" data-i18n="back">Back</button>
  </div>
</section>

<section id="toybox" class="screen" hidden>
  <div class="panel wide">
    <h2 data-i18n="toybox">Toy Box</h2>
    <p class="wallet"><i class="ico ico-coin"></i><b id="toyCoins">0</b></p>
    <div id="upGrid" class="up-grid"></div>
    <h3 data-i18n="paint">Paint Shop</h3>
    <div id="paintGrid" class="paint-grid"></div>
    <button id="btnToyboxBack" class="soft" data-i18n="back">Back</button>
  </div>
</section>

<section id="paused" class="screen" hidden>
  <div class="panel">
    <h2 data-i18n="paused">Paused</h2>
    <button id="btnResume" class="big" data-i18n="resume">Resume</button>
    <div class="row">
      <button id="btnPauseRestart" class="soft" data-i18n="restart">Restart</button>
      <button id="btnPauseStops" class="soft" data-i18n="stops">Stops</button>
    </div>
    <button id="btnQuit" class="soft" data-i18n="menu">Menu</button>
  </div>
</section>

<section id="results" class="screen" hidden>
  <div class="panel">
    <h2 id="resTitle">All aboard!</h2>
    <p id="resSub" class="sub" hidden></p>
    <div class="res-stars" id="resStars">
      <div class="star" id="star0"><i></i><span data-i18n="starDone">Everyone home</span></div>
      <div class="star" id="star1"><i></i><span data-i18n="starNoMishap">No mishaps</span></div>
      <div class="star" id="star2"><i></i><span id="starParLabel"></span></div>
    </div>
    <p class="res-score" id="resScore" hidden><b id="resScoreN">0</b> <span data-i18n="score">passengers home</span><br>
      <span class="dim"><span data-i18n="best">Best</span> <b id="resBest">0</b></span> <span id="resNewBest" class="new" data-i18n="newBest" hidden>New best!</span></p>
    <p class="res-coins"><i class="ico ico-coin"></i>+<b id="resCoins">0</b></p>
    <button id="btnDouble" class="reward" hidden data-i18n="double">▶ Double coins</button>
    <button id="btnNext" class="big" data-i18n="next">Next stop</button>
    <button id="btnRetry" class="big" data-i18n="retry" hidden>Try again</button>
    <div class="row">
      <button id="btnReplay" class="soft" data-i18n="replay">Replay</button>
      <button id="btnResStops" class="soft" data-i18n="stops">Stops</button>
      <button id="btnResMenu" class="soft" data-i18n="menu">Menu</button>
    </div>
  </div>
</section>

<div id="loading"><div class="logo small">Swivel<span>Express</span></div><div class="bar"><i id="loadBar"></i></div></div>
<div id="toast" hidden></div>
<script type="module" src="game.js"></script>
</body>
</html>
