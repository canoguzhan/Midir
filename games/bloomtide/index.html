<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="flash" hidden></div>

<div id="hud" hidden>
  <div class="hud-left">
    <div class="pill big-pill"><svg class="petal-ico"><use href="#i-petal"/></svg><b id="petals">0</b></div>
    <div class="pill small-pill"><span id="income">+0</span><span data-i18n="perSec">/s</span></div>
  </div>
  <div class="hud-mid">
    <div class="season-chip"><svg id="seasonIco"><use href="#i-blossom"/></svg><b id="seasonName">Spring</b><small id="yearName">Year 1</small></div>
    <div class="goal"><div class="goal-bar"><i id="goalFill"></i></div><small id="goalText"></small></div>
    <button id="btnSeason" class="season-btn" hidden></button>
  </div>
  <div class="hud-right"><button id="btnPause" class="icon" aria-label="Pause"><svg><use href="#i-pause"/></svg></button></div>
</div>

<div id="dock" hidden></div>
<div id="zonePrompt" hidden><span id="zoneName"></span><button id="btnZone"></button></div>
<div id="arrow" hidden><svg><use href="#i-arrow"/></svg></div>
<div id="pops"></div>
<div id="banner" hidden><b id="bannerText"></b><small id="bannerSub"></small></div>

<div id="thunder" hidden>
  <button id="btnThunder" aria-label="Thunder"><svg><use href="#i-bolt"/></svg><i id="thunderCd"></i></button>
  <span class="key keyhint" id="thunderKey">Space</span>
</div>

<div id="coach" hidden>
  <div class="coach-keys" id="coachKeys"></div>
  <span id="coachText"></span>
  <button id="btnSkipTips" class="skip" data-i18n="skipTips">Skip tips</button>
</div>
<div id="hand" hidden></div>

<div id="joystick" hidden><div class="knob"></div></div>

<section id="menu" class="screen" hidden>
  <div class="card menu-card">
    <h1>Bloomtide</h1>
    <p class="tagline" data-i18n="tagline">Rain on a dry valley and watch it bloom.</p>
    <div class="menu-stats" id="menuStats"></div>
    <button id="btnPlay" class="big"><svg><use href="#i-play"/></svg><span id="playLabel" data-i18n="play">Play</span></button>
    <div class="row"><button id="btnSettings" class="subtle"><svg><use href="#i-sliders"/></svg><span data-i18n="settings">Settings</span></button></div>
    <div class="controls" id="menuControls"></div>
  </div>
</section>

<section id="paused" class="screen" hidden>
  <div class="card center">
    <h2 data-i18n="paused">Paused</h2>
    <button id="btnResume" class="big" data-i18n="resume">Resume</button>
    <div class="row"><button id="btnPauseSettings" class="subtle"><svg><use href="#i-sliders"/></svg><span data-i18n="settings">Settings</span></button><button id="btnQuit" class="subtle" data-i18n="menu">Menu</button></div>
  </div>
</section>

<section id="settings" class="screen" hidden>
  <div class="card center settings">
    <h2 data-i18n="settings">Settings</h2>
    <label class="slider"><span data-i18n="music">Music</span><input type="range" id="volMusic" min="0" max="100" step="5"><b id="volMusicVal"></b></label>
    <label class="slider"><span data-i18n="sound">Sound</span><input type="range" id="volSfx" min="0" max="100" step="5"><b id="volSfxVal"></b></label>
    <div class="setrow"><span data-i18n="graphics">Graphics</span><div class="seg" id="gfxSeg" role="radiogroup"></div></div>
    <p class="legal" data-i18n="privacy"></p>
    <button id="btnSettingsDone" class="big" data-i18n="done">Done</button>
  </div>
</section>

<section id="away" class="screen" hidden>
  <div class="card center">
    <h2 data-i18n="welcomeBack">Welcome back!</h2>
    <p class="sub" data-i18n="awaySub">Your valley kept blooming while you were away.</p>
    <p class="final"><svg class="petal-ico"><use href="#i-petal"/></svg><b id="awayPetals">0</b></p>
    <button id="btnAwayDouble" class="reward" hidden><svg><use href="#i-play"/></svg><span data-i18n="doubleIt">Watch an ad: double it</span></button>
    <button id="btnAwayOk" class="big" data-i18n="collect">Collect</button>
  </div>
</section>

<section id="seasonEnd" class="screen" hidden>
  <div class="card center season-card">
    <h2 id="seasonEndTitle"></h2>
    <p class="sub" id="seasonEndSub"></p>
    <div class="seed-gain"><svg><use href="#i-seed"/></svg><b id="seedGain">+0</b><small data-i18n="seedsWord">seeds</small></div>
    <p class="sub" id="seedBonus"></p>
    <button id="btnSeedDouble" class="reward" hidden><svg><use href="#i-play"/></svg><span data-i18n="doubleSeeds">Watch an ad: double seeds</span></button>
    <button id="btnNextSeason" class="big"></button>
    <button id="btnStay" class="subtle" data-i18n="stay">Keep playing this season</button>
  </div>
</section>

<div id="loading"><h1>Bloomtide</h1><div class="bar"><i id="loadBar"></i></div></div>
<div id="toast" hidden></div>
<script type="module" src="game.js"></script>
</body>
</html>
