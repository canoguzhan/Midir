<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Merge Siege Defense</title>
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<script type="importmap">{"imports":{"three":"./assets/vendor/three/three.module.min.js","three/addons/":"./assets/vendor/three/addons/"}}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="floaters"></div>

<div id="hud" hidden>
  <div class="hud-left">
    <div class="castle"><span class="lbl" data-i18n="castle">Castle</span><div class="hpbar"><i id="hpFill"></i></div><b id="hpText">100</b></div>
    <div class="pill wave"><span data-i18n="wave">Wave</span> <b id="waveNum">1</b></div>
  </div>
  <div class="hud-right">
    <div class="pill gold"><img src="assets/visuals/icon_coin.webp" alt="" onerror="this.remove()"><b id="gold">0</b></div>
    <button id="btnSpeed" class="icon" aria-label="Speed">1×</button>
    <button id="btnPause" class="icon" aria-label="Pause">II</button>
  </div>
  <div class="hud-bottom">
    <button id="btnMerge" class="side" data-i18n="merge">Merge</button>
    <button id="btnSummon" class="big"><span data-i18n="summon">Summon</span><small><img src="assets/visuals/icon_coin.webp" alt="" onerror="this.remove()"><b id="summonCost">10</b></small></button>
    <div class="side tierinfo" id="tierInfo"></div>
  </div>
</div>
<div id="banner" hidden></div>

<section id="menu" class="screen" hidden>
  <h1>Merge Siege<br><span>Defense</span></h1>
  <div class="stats"><span><img src="assets/visuals/icon_trophy.webp" alt="" onerror="this.remove()"><span data-i18n="bestWave">Best wave</span> <b class="bestWave">0</b></span>
    <span><img src="assets/visuals/icon_gem.webp" alt="" onerror="this.remove()"><b class="gems">0</b></span></div>
  <button id="btnPlay" class="big" data-i18n="play">Play</button>
  <button id="btnArmory" data-i18n="armory">Armory</button>
  <p class="hint" id="hint"></p>
</section>

<section id="armory" class="screen" hidden>
  <h2 data-i18n="armory">Armory</h2>
  <p class="stats"><span><img src="assets/visuals/icon_gem.webp" alt="" onerror="this.remove()"><b class="gems">0</b></span></p>
  <div id="upgrades"></div>
  <button id="btnArmoryBack" data-i18n="back">Back</button>
</section>

<section id="paused" class="screen" hidden>
  <h2 data-i18n="paused">Paused</h2>
  <button id="btnResume" class="big" data-i18n="resume">Resume</button>
  <button id="btnQuit" data-i18n="menu">Menu</button>
</section>

<section id="gameover" class="screen" hidden>
  <h2 data-i18n="fallen">The castle has fallen</h2>
  <p class="final"><span data-i18n="wave">Wave</span> <b id="finalWave">0</b></p>
  <p class="best"><span data-i18n="bestWave">Best wave</span>: <b class="bestWave">0</b> <span id="newBest" data-i18n="newBest" hidden>New best!</span></p>
  <p class="reward"><img src="assets/visuals/icon_gem.webp" alt="" onerror="this.remove()">+<b id="gemsEarned">0</b> <span data-i18n="gemsWord">gems</span></p>
  <button id="btnDouble" class="rewarded" data-i18n="double" hidden>▶ Double gems</button>
  <button id="btnRetry" class="big" data-i18n="again">Play again</button>
  <div class="row"><button id="btnOverArmory" data-i18n="armory">Armory</button><button id="btnMenu" data-i18n="menu">Menu</button></div>
</section>

<div id="loading"><div class="ltitle">Merge Siege Defense</div><div class="bar"><i id="loadBar"></i></div></div>
<div id="toast" hidden></div>
<script type="module" src="game.js"></script>
</body>
</html>
