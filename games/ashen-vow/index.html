<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ashen Vow</title>
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<script type="importmap">{"imports":{"three":"./assets/vendor/three/three.module.min.js","three/addons/":"./assets/vendor/three/addons/"}}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-ember" viewBox="0 0 24 24"><path d="M12 2c1 3.5 5 5.6 5 10.4A5 5 0 0 1 12 18a5 5 0 0 1-5-5.2c0-2 1-3.4 2-4.3.2 1.6 1 2.6 2 3-.4-3.4.4-6.6 1-9.5zm0 20a3 3 0 0 1-3-3h6a3 3 0 0 1-3 3z"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21 3.5 12.6A5.2 5.2 0 0 1 12 6a5.2 5.2 0 0 1 8.5 6.6z"/></symbol>
  <symbol id="i-sword" viewBox="0 0 24 24"><path d="M20.5 2 21 3.5 10.6 13.9l-1.4-1.4zM7.8 13.9l2.3 2.3-1.4 1.4-1.1-1.1-2.8 2.8.9 2.1L3.6 22 2 20.4l.6-2.1 2.1.9 2.8-2.8-1.1-1.1z"/></symbol>
  <symbol id="i-vow" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5zm0 4.5 1.4 3 3.3.4-2.4 2.3.6 3.3-2.9-1.6-2.9 1.6.6-3.3-2.4-2.3 3.3-.4z"/></symbol>
  <symbol id="i-relic" viewBox="0 0 24 24"><path d="M12 2l4 5-4 15-4-15zm-6 5h3l3 13zm9 0h3l-6 13z"/></symbol>
  <symbol id="i-camp" viewBox="0 0 24 24"><path d="M12 3 2 20h7l3-5 3 5h7zm0 6 4.5 8h-2L12 13l-2.5 4h-2z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zm7.5 0H18v16h-4.5z"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M3 6h9.2a3 3 0 0 1 5.6 0H21v2h-3.2a3 3 0 0 1-5.6 0H3zm0 10h3.2a3 3 0 0 1 5.6 0H21v2h-9.2a3 3 0 0 1-5.6 0H3z"/></symbol>
  <symbol id="i-roll" viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 7.7 10.2l-1.9-.6A6 6 0 1 1 16.2 7.8L14 10h6V4l-2.4 2.4A8 8 0 0 0 12 4z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><path d="M7 10V8a5 5 0 0 1 10 0v2h1.5v11h-13V10zm2 0h6V8a3 3 0 0 0-6 0z"/></symbol>
  <symbol id="i-skull" viewBox="0 0 24 24"><path d="M12 2a8 8 0 0 0-8 8c0 2.6 1.2 4.6 3 5.8V19h2v2h2v-2h2v2h2v-2h2v-3.2c1.8-1.2 3-3.2 3-5.8a8 8 0 0 0-8-8zm-3 7a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm6 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M9.5 16.2 4.8 11.5 3.4 13l6.1 6.1L21 7.6l-1.4-1.4z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4z"/></symbol>
</svg>

<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="hurt"></div>
<div id="flash" hidden></div>

<div id="hud" hidden>
  <div class="hud-left">
    <div class="hp"><svg><use href="#i-heart"/></svg><div class="hp-bar"><i id="hpFill"></i><b id="hpText">100</b></div></div>
    <div class="pill embers"><svg><use href="#i-ember"/></svg><b id="emberText">0</b></div>
    <div class="relics" id="relicRow"></div>
  </div>
  <div class="hud-mid">
    <div class="floor-chip"><b id="floorText">Floor 1</b><small id="actText">The Cathedral</small></div>
    <div class="vow-chip" id="vowChip" hidden><svg><use href="#i-vow"/></svg><span id="vowText"></span></div>
  </div>
  <div class="hud-right"><button id="btnPause" class="icon" aria-label="Pause"><svg><use href="#i-pause"/></svg></button></div>
</div>
<div id="bossBar" hidden><b id="bossName"></b><div class="bar"><i id="bossFill"></i></div></div>
<div id="pops"></div>
<div id="banner" hidden><b id="bannerText"></b><small id="bannerSub"></small></div>
<div id="dodge" hidden><button id="btnDodge" aria-label="Dodge roll"><svg><use href="#i-roll"/></svg><i id="dodgeCd"></i></button><span class="key keyhint">Space</span></div>
<div id="coach" hidden><div class="coach-keys" id="coachKeys"></div><span id="coachText"></span><button id="btnSkipTips" class="skip" data-i18n="skipTips">Skip tips</button></div>
<div id="hand" hidden></div>
<div id="arrow" hidden><svg viewBox="0 0 24 24"><path d="M12 3l8 9h-5v9H9v-9H4z"/></svg></div>
<div id="joystick" hidden><div class="knob"></div></div>

<section id="menu" class="screen" hidden>
  <div class="card menu-card">
    <h1>Ashen Vow</h1>
    <p class="tagline" data-i18n="tagline">Climb the burning cathedral. Swear vows. Break the curse.</p>
    <div class="menu-stats" id="menuStats"></div>
    <button id="btnPlay" class="big"><svg><use href="#i-play"/></svg><span data-i18n="play">Play</span></button>
    <div class="row two">
      <button id="btnCamp" class="subtle"><svg><use href="#i-camp"/></svg><span data-i18n="camp">Camp</span></button>
      <button id="btnSettings" class="subtle"><svg><use href="#i-sliders"/></svg><span data-i18n="settings">Settings</span></button>
    </div>
    <div class="controls" id="menuControls"></div>
  </div>
</section>

<section id="camp" class="screen" hidden>
  <div class="card wide">
    <div class="card-head"><h2 data-i18n="camp">Camp</h2><div class="pill embers"><svg><use href="#i-ember"/></svg><b id="campEmbers">0</b></div></div>
    <p class="sub" data-i18n="campSub">Embers you carry out of the tower stay with you. Spend them on lasting strength.</p>
    <div class="grid" id="metaGrid"></div>
    <h3 data-i18n="weapons">Weapons</h3>
    <div class="grid" id="weaponGrid"></div>
    <button id="btnCampBack" class="big" data-i18n="done">Done</button>
  </div>
</section>

<section id="pick" class="screen pick" hidden>
  <div class="pick-wrap">
    <h2 id="pickTitle"></h2>
    <p class="sub" id="pickSub"></p>
    <div class="cards" id="pickCards"></div>
    <div class="row"><button id="btnPickSkip" class="subtle" hidden></button><button id="btnReroll" class="subtle" hidden></button></div>
  </div>
</section>

<section id="over" class="screen" hidden>
  <div class="card center over-card">
    <h2 id="overTitle"></h2>
    <p class="sub" id="overSub"></p>
    <div class="stats" id="overStats"></div>
    <div class="final"><svg><use href="#i-ember"/></svg><b id="overEmbers">+0</b></div>
    <button id="btnOverDouble" class="reward" hidden><svg><use href="#i-play"/></svg><span data-i18n="doubleEmbers">Watch an ad: double embers</span></button>
    <button id="btnOverAgain" class="big" data-i18n="again">Climb again</button>
    <div class="row"><button id="btnOverCamp" class="subtle"><svg><use href="#i-camp"/></svg><span data-i18n="camp">Camp</span></button><button id="btnOverMenu" class="subtle" data-i18n="menu">Menu</button></div>
  </div>
</section>

<section id="paused" class="screen" hidden>
  <div class="card center">
    <h2 data-i18n="paused">Paused</h2>
    <div class="relic-list" id="pauseRelics"></div>
    <button id="btnResume" class="big" data-i18n="resume">Resume</button>
    <div class="row"><button id="btnPauseSettings" class="subtle"><svg><use href="#i-sliders"/></svg><span data-i18n="settings">Settings</span></button><button id="btnQuit" class="subtle" data-i18n="abandon">Abandon run</button></div>
  </div>
</section>

<section id="settings" class="screen" hidden>
  <div class="card center settings">
    <h2 data-i18n="settings">Settings</h2>
    <label class="slider"><span data-i18n="music">Music</span><input type="range" id="volMusic" min="0" max="100" step="5"><b id="volMusicVal"></b></label>
    <label class="slider"><span data-i18n="sound">Sound</span><input type="range" id="volSfx" min="0" max="100" step="5"><b id="volSfxVal"></b></label>
    <div class="setrow"><span data-i18n="graphics">Graphics</span><div class="seg" id="gfxSeg" role="radiogroup"></div></div>
    <div class="setrow"><span data-i18n="shakeOpt">Screen shake</span><div class="seg" id="shakeSeg" role="radiogroup"></div></div>
    <p class="legal" data-i18n="privacy"></p>
    <button id="btnSettingsDone" class="big" data-i18n="done">Done</button>
  </div>
</section>

<div id="loading"><h1>Ashen Vow</h1><div class="bar"><i id="loadBar"></i></div></div>
<div id="toast" hidden></div>
<script type="module" src="game.js"></script>
</body>
</html>
