<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>{{TITLE}}</title>
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<script type="importmap">{"imports":{"three":"./assets/vendor/three/three.module.min.js","three/addons/":"./assets/vendor/three/addons/"}}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" hidden>
  <div class="pill"><img src="assets/visuals/icon_coin.webp" alt="" onerror="this.remove()"><b id="score">0</b></div>
  <div class="pill dim"><span data-i18n="best">Best</span> <b id="hudBest">0</b></div>
  <button id="btnPause" class="icon" aria-label="Pause">II</button>
</div>

<div id="joystick" hidden><div class="knob"></div></div>
<button id="btnAction" class="touch-btn" hidden aria-label="Dash">⚡</button>

<section id="menu" class="screen" hidden>
  <h1>{{TITLE}}</h1>
  <p class="best"><span data-i18n="best">Best</span>: <b id="menuBest">0</b></p>
  <button id="btnPlay" class="big" data-i18n="play">Play</button>
  <p class="hint" id="hint"></p>
</section>

<section id="paused" class="screen" hidden>
  <h2 data-i18n="paused">Paused</h2>
  <button id="btnResume" class="big" data-i18n="resume">Resume</button>
  <button id="btnQuit" data-i18n="menu">Menu</button>
</section>

<section id="gameover" class="screen" hidden>
  <h2 data-i18n="gameOver">Game Over</h2>
  <p class="final"><b id="finalScore">0</b></p>
  <p class="best"><span data-i18n="best">Best</span>: <b id="overBest">0</b> <span id="newBest" data-i18n="newBest" hidden>New best!</span></p>
  <button id="btnDouble" class="reward" data-i18n="double" hidden>▶ Double coins</button>
  <button id="btnRetry" class="big" data-i18n="again">Play again</button>
  <button id="btnMenu" data-i18n="menu">Menu</button>
</section>

<div id="loading"><div class="bar"><i id="loadBar"></i></div></div>
<div id="toast" hidden></div>
<script type="module" src="game.js"></script>
</body>
</html>
